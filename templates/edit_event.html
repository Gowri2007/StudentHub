<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Event | StudentHub</title>

    <!-- Dashboard CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Reuse Add Event CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/add_event.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        🎓 StudentHub Admin
    </div>

    <ul class="nav-links">

        <li>
            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>
        </li>

        <li>
            <a href="{{ url_for('view_events') }}">
                View Events
            </a>
        </li>

        <li>
            <a href="{{ url_for('admin_logout') }}">
                Logout
            </a>
        </li>

    </ul>

</nav>

<div class="page-container">

    <!-- Back Button -->

    <a href="{{ url_for('view_events') }}"
       class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        Back to View Events

    </a>

    <!-- Heading -->

    <div class="page-title">

        <h1>

            Edit Event

        </h1>

        <p>

            Update the event details below.

        </p>

    </div>

    <!-- Form Card -->

    <div class="form-card">

        <form method="POST">

            <!-- ================= First Row ================= -->

            <div class="form-row">

                <div class="form-group">

                    <label>

                        <i class="fa-solid fa-pen"></i>

                        Event Name

                    </label>

                    <input
                        type="text"
                        name="event_name"
                        value="{{ event.event_name }}"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        <i class="fa-solid fa-layer-group"></i>

                        Category

                    </label>

                    <select
                        name="category"
                        required>

                        <option value="Hackathon"
                            {% if event.category=="Hackathon" %}selected{% endif %}>
                            Hackathon
                        </option>

                        <option value="Workshop"
                            {% if event.category=="Workshop" %}selected{% endif %}>
                            Workshop
                        </option>

                        <option value="Seminar"
                            {% if event.category=="Seminar" %}selected{% endif %}>
                            Seminar
                        </option>

                        <option value="Coding Contest"
                            {% if event.category=="Coding Contest" %}selected{% endif %}>
                            Coding Contest
                        </option>

                        <option value="Webinar"
                            {% if event.category=="Webinar" %}selected{% endif %}>
                            Webinar
                        </option>

                        <option value="Bootcamp"
                            {% if event.category=="Bootcamp" %}selected{% endif %}>
                            Bootcamp
                        </option>

                        <option value="Other"
                            {% if event.category=="Other" %}selected{% endif %}>
                            Other
                        </option>

                    </select>

                </div>

            </div>

            <!-- ================= Second Row ================= -->

            <div class="form-row">

                <div class="form-group">

                    <label>

                        <i class="fa-solid fa-building"></i>

                        College Name

                    </label>

                    <input
                        type="text"
                        name="college_name"
                        value="{{ event.college_name }}"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        <i class="fa-solid fa-location-dot"></i>

                        Venue

                    </label>

                    <input
                        type="text"
                        name="venue"
                        value="{{ event.venue }}"
                        required>

                </div>

            </div>
                        <!-- ================= Third Row ================= -->

            <div class="form-row">

                <div class="form-group">

                    <label>

                        <i class="fa-solid fa-calendar-days"></i>

                        Event Date

                    </label>

                    <input
                        type="date"
                        name="event_date"
                        value="{{ event.event_date }}"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        <i class="fa-solid fa-hourglass-half"></i>

                        Registration Last Date

                    </label>

                    <input
                        type="date"
                        name="last_date"
                        value="{{ event.last_date }}"
                        required>

                </div>

            </div>

            <!-- ================= Description ================= -->

            <div class="form-group">

                <label>

                    <i class="fa-solid fa-align-left"></i>

                    Description

                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="6"
                    maxlength="500"
                    required>{{ event.description }}</textarea>

                <div class="char-count">

                    <span id="count">{{ event.description|length }}</span>/500 characters

                </div>

            </div>

            <!-- ================= Registration Link ================= -->

            <div class="form-group">

                <label>

                    <i class="fa-solid fa-link"></i>

                    Registration Link

                </label>

                <input
                    type="url"
                    name="registration_link"
                    value="{{ event.registration_link }}">

            </div>
                        <!-- ================= Buttons ================= -->

            <div class="button-area">

                <button
                    type="submit"
                    class="publish-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Update Event

                </button>

                <a href="{{ url_for('view_events') }}"
                   class="cancel-btn">

                    <i class="fa-solid fa-xmark"></i>

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

<!-- Character Counter -->

<script>

const description = document.getElementById("description");

const count = document.getElementById("count");

if(description && count){

    count.innerText = description.value.length;

    description.addEventListener("input", function(){

        count.innerText = this.value.length;

    });

}

</script>

<!-- Reuse Add Event JavaScript -->

<script src="{{ url_for('static', filename='js/add_event.js') }}"></script>

</body>

</html>
